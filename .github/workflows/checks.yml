# Runs scripts/check.sh on Linux for every pull request and every push to main (d0056), then approves the
# maintainer's own pull requests once the checks pass, so they can merge with `gh pr merge --squash --auto` (d0107).
# macOS and Windows join later; until then they're checked locally.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The system libraries Tauri builds against, as in scripts/README.md (Linux VM, step 1).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev libnotify-bin
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal -c rustfmt -c clippy
          rustup default 1.99.0
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/otaq-desktop/.nvmrc
          cache: npm
          cache-dependency-path: crates/otaq-desktop/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The core tests commit into temporary git repositories.
      - name: Set a git identity
        run: |
          git config --global user.name "Otaq CI"
          git config --global user.email "ci@otaq.invalid"
      - run: scripts/check.sh

  # Approves only pull requests an admin opened from a branch of this repository. Organization admins have admin
  # rights on every repository, so the repository's own permission check covers them. A fork's run gets a read-only
  # token, so it couldn't approve even if this check were wrong.
  approve:
    name: Approve an admin's pull request
    needs: linux
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)"
          if [ "$permission" != "admin" ]; then
            echo "$AUTHOR isn't an admin ($permission): the pull request waits for an admin's review."
            exit 0
          fi
          gh pr review "$PR_URL" --approve --body "Checks (Linux) passed."
