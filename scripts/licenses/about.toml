# cargo-about configuration for THIRD-PARTY-LICENSES.md (regenerate with scripts/licenses.sh).
#
# Only the crates that end up in the shipped binaries are listed: build scripts, proc macros and test-only crates are
# left out. Every license below lets Otaq (FSL-1.1-MIT) ship the crate as long as its notice ships with the app.

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "bzip2-1.0.6",
    "NCSA",
    # File-level copyleft: unmodified MPL files may ship in an MIT app; the notice says where their source is.
    "MPL-2.0",
]

# The platforms Otaq ships on (d0021).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Otaq's own crates (all `publish = false`) are under FSL-1.1-MIT, see LICENSE: they are not third-party notices.
private = { ignore = true }
