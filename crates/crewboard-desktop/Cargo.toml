[package]
name = "crewboard-desktop"
description = "Crewboard desktop app on Tauri 2: a React + TypeScript page built with Vite (d0074, d0075)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Where the frontend sits (SDD §5.5 implementation choice): inside this crate. `package.json`, the npm lock file and
# the TypeScript / ESLint / Prettier / Vite configs sit next to this file; the page itself is in `ui/` (`ui/index.html`,
# `ui/src/`), and Vite builds it into `ui/dist/`, which `tauri.conf.json` names as `frontendDist`. One folder holds
# everything the app is made of, and `npm` commands run from here. See README.md.

# Named `crewboard-desktop` until T-0245 gives it the GPUI app's name.
[[bin]]
name = "crewboard-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde_json = "1.0.151"
# The service's types (T-0211 on) and the view models the screens show.
crewboard-core = { path = "../crewboard-core" }
crewboard-view = { path = "../crewboard-view" }
# The types the page reads, serialized as JSON; their TypeScript is generated with ts-rs into `ui/src/generated/`
# (d0075 point 3, UIT-04, see `src/generated.rs`).
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = "12.0.1"

[dev-dependencies]
# The freshness test generates the types into a temporary folder.
tempfile = "3.27.0"

[features]
# Set by the Tauri CLI for release builds: the page is served from the binary, not from the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
