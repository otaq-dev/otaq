[package]
name = "crewboard-app"
description = "Crewboard desktop app (GPUI client of the background service)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
crewboard-core = { path = "../crewboard-core" }
# GPUI pinned to one Zed commit (d0001, d0055): Zed tag v1.23.2, commit c0199504b9cc, 2026-10-07.
# Use Zed's source at this commit as the reference. Bump deliberately, together with the async-task patch in the
# workspace Cargo.toml.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c0199504b9cce79bc27524950022ed701bc3ebd5" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c0199504b9cce79bc27524950022ed701bc3ebd5", features = ["font-kit"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync"] }
# Terminal emulation for the Terminal tab (d0001, d0055), the same fork and revision the pinned Zed tag uses.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
# Event payloads in the History tab (the core's JSON values).
serde_json = "1.0.151"
# Grapheme boundaries for cursor movement in text inputs.
unicode-segmentation = "1.13.3"
# Syntax highlighting in the Diff tab (d0017, d0055): the bundled grammars, parsed with the pure-Rust regex engine;
# scopes are coloured with the app's own tokens, so no syntect theme is used.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }

# Linux: the windowing backends (GPUI picks Wayland or X11 at run time; without one the app can't open a window).
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c0199504b9cce79bc27524950022ed701bc3ebd5", features = ["font-kit", "wayland", "x11"] }
