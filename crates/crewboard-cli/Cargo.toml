[package]
name = "crewboard-cli"
description = "The crewboard command: launches the app; daemon, attach, hook and agent commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "crewboard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crewboard-core = { path = "../crewboard-core" }
serde = "1.0.229"
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
