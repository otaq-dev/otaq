[package]
name = "crewboard-view"
description = "Otaq view models: the UI's logic as plain Rust, without Tauri (d0075), read by the desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
crewboard-core = { path = "../crewboard-core" }
# Event payloads in the History tab (the core's JSON values).
serde_json = "1.0.151"
# The types the Tauri page reads are serialized as JSON and their TypeScript is generated from them with ts-rs (d0075
# point 3, UIT-04); the desktop crate writes the files and checks they are fresh.
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = "12.0.1"
# Syntax highlighting in the Diff tab (d0017, d0055): the bundled grammars, parsed with the pure-Rust regex engine;
# scopes are coloured with the app's own tokens, so no syntect theme is used.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }

[dev-dependencies]
# The editor's tests drive the service link's async calls on a runtime.
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync"] }
