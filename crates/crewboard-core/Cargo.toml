[package]
name = "crewboard-core"
description = "Crewboard core: domain, store, scheduler, git, sessions and the background service. No UI dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Temporary git repositories for tests (git::testing); also used by the other crates' tests.
tempfile = "3.27.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.27.0", features = ["v7"] }
portable-pty = "0.9.0"
base64 = "0.22.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }

